[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-cli"
version = "0.1.0"
description = "Текстовый квест на Click и SQLAlchemy с сохранением и статистикой"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
quest = "quest.cli:cli"

[tool.setuptools.packages.find]
include = ["quest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
